<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lienzo de pantallas</title>
<style>
  :root {
    --bg: #1e1e1e;
    --dot: #2c2c2c;
    --bar: #2c2c2c;
    --bar-border: #3a3a3a;
    --text: #e6e6e6;
    --muted: #9a9a9a;
    --accent: #0d99ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 12px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  #viewport { position: fixed; inset: 40px 0 0 0; overflow: hidden; cursor: default;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 24px 24px; }
  #viewport.panning, #viewport.space { cursor: grab; }
  #viewport.panning { cursor: grabbing; }
  #viewport.panning iframe, #viewport.space iframe { pointer-events: none; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: flex; gap: 120px; align-items: flex-start; padding: 80px; }
  .frame { flex: none; }
  .label { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); margin-bottom: 8px; white-space: nowrap; }
  .label b { color: var(--text); font-weight: 500; }
  .label a { color: var(--muted); text-decoration: none; }
  .label a:hover { color: var(--accent); }
  .screen { background: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 12px 40px rgba(0,0,0,.45); overflow: hidden; }
  .frame.active .screen { box-shadow: 0 0 0 2px var(--accent), 0 12px 40px rgba(0,0,0,.45); }
  iframe { display: block; border: 0; background: #fff; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 40px; background: var(--bar); border-bottom: 1px solid var(--bar-border);
    display: flex; align-items: center; gap: 8px; padding: 0 12px; z-index: 10; }
  header .title { font-weight: 600; margin-right: 8px; }
  header input { background: #1e1e1e; border: 1px solid var(--bar-border); color: var(--text); border-radius: 4px; height: 26px; padding: 0 8px; width: 220px; font: inherit; }
  header input:focus { outline: none; border-color: var(--accent); }
  header button { background: transparent; border: 1px solid transparent; color: var(--text); border-radius: 4px; height: 26px; padding: 0 8px; font: inherit; cursor: pointer; }
  header button:hover { background: #383838; }
  header .spacer { flex: 1; }
  header .zoom { min-width: 48px; text-align: center; color: var(--muted); }
  header .hint { color: var(--muted); }
  @media (max-width: 760px) { header .hint, header .title { display: none; } header input { width: 120px; } }
</style>
</head>
<body>
<header>
  <span class="title">Pantallas</span>
  <input id="path" value="/" aria-label="Ruta de la página" spellcheck="false">
  <button id="reload" title="Recargar todas">↻ Recargar</button>
  <span class="spacer"></span>
  <span class="hint">Arrastrar fondo o espacio+arrastrar: mover · Ctrl+rueda: zoom</span>
  <button id="zoomOut" title="Alejar">−</button>
  <span class="zoom" id="zoomLabel">100%</span>
  <button id="zoomIn" title="Acercar">+</button>
  <button id="fit" title="Ajustar a pantalla (Shift+1)">Ajustar</button>
</header>
<div id="viewport"><div id="world"></div></div>

<script>
  const BASE = location.origin;
  const FRAMES = [
    { name: 'Desktop', w: 1440, h: 900 },
    { name: 'Laptop',  w: 1280, h: 800 },
    { name: 'Tablet',  w: 768,  h: 1024 },
    { name: 'Mobile',  w: 390,  h: 844 },
  ];

  const world = document.getElementById('world');
  const vp = document.getElementById('viewport');
  const pathInput = document.getElementById('path');
  const zoomLabel = document.getElementById('zoomLabel');
  let view = { x: 0, y: 0, s: 1 };

  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
  pathInput.value = safeGet('canvas-path') || '/';

  function url() {
    let p = pathInput.value.trim() || '/';
    if (!p.startsWith('/')) p = '/' + p;
    return BASE + p;
  }

  function build() {
    world.innerHTML = '';
    for (const f of FRAMES) {
      const el = document.createElement('div');
      el.className = 'frame';
      el.innerHTML = `<div class="label"><span><b>${f.name}</b> — ${f.w}×${f.h}</span><a href="${url()}" target="_blank" rel="noopener">abrir ↗</a></div>
        <div class="screen" style="width:${f.w}px;height:${f.h}px"><iframe width="${f.w}" height="${f.h}" src="${url()}" title="${f.name}"></iframe></div>`;
      el.addEventListener('pointerdown', () => {
        document.querySelectorAll('.frame.active').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
      });
      world.appendChild(el);
    }
  }

  function apply() {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
    zoomLabel.textContent = Math.round(view.s * 100) + '%';
  }

  function zoomAt(factor, cx, cy) {
    const s = Math.min(4, Math.max(0.05, view.s * factor));
    const k = s / view.s;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.s = s;
    apply();
  }

  function fit() {
    const r = vp.getBoundingClientRect();
    const w = world.scrollWidth, h = world.scrollHeight;
    view.s = Math.min(r.width / w, r.height / h);
    view.x = (r.width - w * view.s) / 2;
    view.y = (r.height - h * view.s) / 2;
    apply();
  }

  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    } else {
      view.x -= e.shiftKey ? e.deltaY : e.deltaX;
      view.y -= e.shiftKey ? 0 : e.deltaY;
      apply();
    }
  }, { passive: false });

  let drag = null, space = false;
  vp.addEventListener('pointerdown', e => {
    const onBg = e.target === vp || e.target === world;
    if (e.button === 1 || space || (e.button === 0 && onBg)) {
      e.preventDefault();
      drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
      vp.classList.add('panning');
      vp.setPointerCapture(e.pointerId);
    }
  });
  vp.addEventListener('pointermove', e => {
    if (!drag) return;
    view.x = drag.vx + e.clientX - drag.x;
    view.y = drag.vy + e.clientY - drag.y;
    apply();
  });
  const end = () => { drag = null; vp.classList.remove('panning'); };
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);

  window.addEventListener('keydown', e => {
    if (e.target === pathInput) return;
    if (e.code === 'Space') { space = true; vp.classList.add('space'); e.preventDefault(); }
    if (e.shiftKey && e.code === 'Digit1') fit();
    if (e.shiftKey && e.code === 'Digit0') { const r = vp.getBoundingClientRect(); zoomAt(1 / view.s, r.width / 2, r.height / 2); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { space = false; vp.classList.remove('space'); } });

  const center = () => { const r = vp.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
  document.getElementById('zoomIn').onclick = () => zoomAt(1.25, ...center());
  document.getElementById('zoomOut').onclick = () => zoomAt(0.8, ...center());
  document.getElementById('fit').onclick = fit;
  document.getElementById('reload').onclick = build;
  pathInput.addEventListener('keydown', e => { if (e.key === 'Enter') { safeSet('canvas-path', pathInput.value); build(); pathInput.blur(); } });

  build();
  requestAnimationFrame(fit);
  window.addEventListener('resize', fit);
</script>
</body>
</html>
